<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Производственный Учет 2.0</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f1f5f9;
            --surface: #ffffff;
            --text: #1e293b;
            --border: #cbd5e1;
            --success: #16a34a;
            --danger: #dc2626;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 15px; max-width: 900px; margin: 0 auto; }
        
        h1 { text-align: center; margin-bottom: 20px; font-size: 1.4rem; }
        .card { background: var(--surface); border-radius: 10px; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; }
        
        /* Статистика */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: var(--primary); color: white; padding: 15px; border-radius: 8px; text-align: center; }
        .stat-val { font-size: 1.5rem; font-weight: bold; }
        .stat-lbl { font-size: 0.8rem; opacity: 0.9; }

        /* Форма */
        .form-row { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
        .form-group { flex: 1; min-width: 140px; display: flex; flex-direction: column; }
        label { font-size: 0.85rem; font-weight: 600; margin-bottom: 5px; color: #64748b; }
        input, select { padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 1rem; width: 100%; }
        input:focus { outline: 2px solid var(--primary); border-color: transparent; }
        
        /* Динамические поля */
        .dynamic-inputs { display: none; background: #f8fafc; padding: 10px; border-radius: 6px; border: 1px dashed var(--border); margin-bottom: 12px; }
        .dynamic-inputs.active { display: block; }
        
        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-sm { padding: 5px 10px; font-size: 0.8rem; width: auto; }
        .btn-danger { background: var(--danger); color: white; }

        /* Таблица */
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th { text-align: left; padding: 10px; border-bottom: 2px solid var(--border); color: #64748b; font-size: 0.8rem; }
        td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
        .money { font-weight: bold; color: var(--success); }
        
        /* Адаптив */
        @media (max-width: 600px) {
            .hide-mob { display: none; }
            .form-group { min-width: 100%; }
        }
    </style>
</head>
<body>

    <h1>🏭 Учет работ (Многопрофильный)</h1>

    <!-- Сводка -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-val" id="totalSum">0 ₽</div>
            <div class="stat-lbl">Заработок (фильтр)</div>
        </div>
        <div class="stat-card" style="background: var(--success);">
            <div class="stat-val" id="totalCount">0</div>
            <div class="stat-lbl">Записей</div>
        </div>
    </div>

    <!-- Фильтры -->
    <div class="card">
        <div class="form-row">
            <div class="form-group">
                <label>Оператор</label>
                <input type="text" id="filterWorker" placeholder="Все..." oninput="renderTable()">
            </div>
            <div class="form-group">
                <label>Дата с</label>
                <input type="date" id="filterDateStart" onchange="renderTable()">
            </div>
            <div class="form-group">
                <label>По</label>
                <input type="date" id="filterDateEnd" onchange="renderTable()">
            </div>
        </div>
    </div>

    <!-- Форма ввода -->
    <div class="card">
        <h3 style="margin-bottom: 15px;">➕ Добавить работу</h3>
        <form id="workForm" onsubmit="addRecord(event)">
            
            <div class="form-row">
                <div class="form-group">
                    <label>Дата</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label>Оператор</label>
                    <input type="text" id="worker" list="workersList" placeholder="Иванов" required>
                    <datalist id="workersList"></datalist>
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 15px;">
                <label>Тип работы (выбор меняет поля ниже)</label>
                <select id="jobType" onchange="updateFormFields()" required style="font-weight: bold; color: var(--primary);">
                    <option value="cut_mdf">Распил МДФ/ЛДСП (м²)</option>
                    <option value="veneer">Шпонирование (м²)</option>
                    <option value="edge">Кромление (пог. м)</option>
                    <option value="assembly">Сборка/Прочее (шт)</option>
                    <option value="hourly">Почасовая оплата (часы)</option>
                </select>
            </div>

            <!-- Контейнер для динамических полей -->
            <div id="dynamicArea">
                <!-- Сюда JS будет вставлять нужные инпуты -->
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Ставка (₽ за ед.)</label>
                    <input type="number" id="rate" step="0.01" required oninput="calcPreview()">
                </div>
                <div class="form-group">
                    <label>Итого: <span id="previewSum" style="color:var(--success); font-size:1.2rem">0 ₽</span></label>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">💾 Сохранить запись</button>
        </form>
    </div>

    <!-- Таблица -->
    <div class="card">
        <h3 style="margin-bottom: 10px;">📊 Журнал</h3>
        <div style="overflow-x: auto;">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>Дата / Кто</th>
                        <th>Работа / Детали</th>
                        <th>Объем</th>
                        <th>Сумма</th>
                        <th>Действ.</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- Управление данными -->
    <div class="card" style="text-align: center;">
        <button class="btn btn-sm" style="background:#e2e8f0; margin:5px;" onclick="exportCSV()">📥 Скачать Excel (CSV)</button>
        <button class="btn btn-sm" style="background:#e2e8f0; margin:5px;" onclick="exportJSON()">💾 Бэкап (JSON)</button>
        <label class="btn btn-sm" style="background:#e2e8f0; margin:5px; display:inline-block; cursor:pointer;">
            📤 Восстановить
            <input type="file" onchange="importJSON(this)" style="display:none" accept=".json">
        </label>
        <br><br>
        <button class="btn btn-sm btn-danger" onclick="clearData()">🗑️ Очистить всё</button>
    </div>

    <script>
        // --- КОНФИГУРАЦИЯ ТИПОВ РАБОТ ---
        const JOB_CONFIG = {
            'cut_mdf': { 
                label: 'Распил (м²)', 
                inputs: ['length', 'width', 'qty'], // длина, ширина, кол-во
                defaultRate: 65,
                unit: 'м²'
            },
            'veneer': { 
                label: 'Шпонирование (м²)', 
                inputs: ['area_manual'], // ручной ввод площади
                defaultRate: 1000,
                unit: 'м²'
            },
            'edge': { 
                label: 'Кромление (пог.м)', 
                inputs: ['meters'], // ручной ввод метров
                defaultRate: 50, // Пример ставки
                unit: 'пог.м'
            },
            'assembly': { 
                label: 'Сборка (шт)', 
                inputs: ['qty_only'], 
                defaultRate: 500,
                unit: 'шт'
            },
            'hourly': { 
                label: 'Почасовая', 
                inputs: ['time_range'], // время начало/конец
                defaultRate: 300,
                unit: 'час'
            }
        };

        const STORAGE_KEY = 'factory_db_v2';
        let records = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

        // Инициализация
        document.getElementById('date').valueAsDate = new Date();
        updateWorkersList();
        updateFormFields(); // Создать поля для первого типа
        renderTable();

        // --- ЛОГИКА ФОРМЫ ---

        function updateFormFields() {
            const type = document.getElementById('jobType').value;
            const config = JOB_CONFIG[type];
            const container = document.getElementById('dynamicArea');
            
            // Сброс значения ставки на дефолтное для этого типа
            document.getElementById('rate').value = config.defaultRate;
            
            let html = '';

            // Генерация полей в зависимости от типа
            if (config.inputs.includes('length')) {
                // Для распила: Длина, Ширина, Кол-во -> Считаем площадь автоматически
                html += `
                    <div class="form-row dynamic-inputs active">
                        <div class="form-group"><label>Длина (мм)</label><input type="number" id="inp_l" placeholder="2800" oninput="calcAutoArea()"></div>
                        <div class="form-group"><label>Ширина (мм)</label><input type="number" id="inp_w" placeholder="2070" oninput="calcAutoArea()"></div>
                        <div class="form-group"><label>Кол-во (шт)</label><input type="number" id="inp_q" value="1" oninput="calcAutoArea()"></div>
                    </div>
                    <div class="form-row dynamic-inputs active" style="background:#e0f2fe">
                        <div class="form-group"><label>Итого площадь (м²)</label><input type="number" id="calc_area" readonly style="background:#fff; font-weight:bold;"></div>
                    </div>
                `;
            } else if (config.inputs.includes('area_manual')) {
                html += `<div class="form-row dynamic-inputs active"><div class="form-group"><label>Площадь (м²)</label><input type="number" step="0.01" id="inp_area" placeholder="0.00" oninput="calcPreview()"></div></div>`;
            } else if (config.inputs.includes('meters')) {
                html += `<div class="form-row dynamic-inputs active"><div class="form-group"><label>Погонные метры</label><input type="number" step="0.1" id="inp_meters" placeholder="0.0" oninput="calcPreview()"></div></div>`;
            } else if (config.inputs.includes('qty_only')) {
                html += `<div class="form-row dynamic-inputs active"><div class="form-group"><label>Количество (шт)</label><input type="number" id="inp_qty" placeholder="0" oninput="calcPreview()"></div></div>`;
            } else if (config.inputs.includes('time_range')) {
                html += `
                    <div class="form-row dynamic-inputs active">
                        <div class="form-group"><label>Начало</label><input type="time" id="time_start" oninput="calcHours()"></div>
                        <div class="form-group"><label>Конец</label><input type="time" id="time_end" oninput="calcHours()"></div>
                        <div class="form-group"><label>Часов</label><input type="number" id="calc_hours" readonly style="background:#fff"></div>
                    </div>
                `;
            }

            container.innerHTML = html;
            calcPreview();
        }

        // Авто-расчет площади для распила (мм -> м²)
        function calcAutoArea() {
            const l = parseFloat(document.getElementById('inp_l').value) || 0;
            const w = parseFloat(document.getElementById('inp_w').value) || 0;
            const q = parseFloat(document.getElementById('inp_q').value) || 0;
            // мм * мм / 1 000 000 = м²
            const area = (l * w * q) / 1000000;
            document.getElementById('calc_area').value = area.toFixed(3);
            calcPreview();
        }

        // Авто-расчет часов
        function calcHours() {
            const s = document.getElementById('time_start').value;
            const e = document.getElementById('time_end').value;
            if(s && e) {
                let start = new Date("2000-01-01 " + s);
                let end = new Date("2000-01-01 " + e);
                if (end < start) end.setDate(end.getDate() + 1); // переход через полночь
                const diff = (end - start) / 3600000;
                document.getElementById('calc_hours').value = diff.toFixed(2);
                calcPreview();
            }
        }

        // Предпросмотр суммы
        function calcPreview() {
            const rate = parseFloat(document.getElementById('rate').value) || 0;
            const type = document.getElementById('jobType').value;
            let qty = 0;

            if (type === 'cut_mdf') qty = parseFloat(document.getElementById('calc_area').value) || 0;
            else if (type === 'veneer') qty = parseFloat(document.getElementById('inp_area').value) || 0;
            else if (type === 'edge') qty = parseFloat(document.getElementById('inp_meters').value) || 0;
            else if (type === 'assembly') qty = parseFloat(document.getElementById('inp_qty').value) || 0;
            else if (type === 'hourly') qty = parseFloat(document.getElementById('calc_hours').value) || 0;

            const total = qty * rate;
            document.getElementById('previewSum').innerText = Math.round(total) + ' ₽';
            return { qty, total };
        }

        // --- СОХРАНЕНИЕ ---

        function addRecord(e) {
            e.preventDefault();
            const { qty, total } = calcPreview();
            if (qty <= 0) { alert('Укажите объем работ!'); return; }

            const type = document.getElementById('jobType').value;
            const config = JOB_CONFIG[type];
            
            // Формируем описание для истории
            let desc = '';
            if(type === 'cut_mdf') {
                const l = document.getElementById('inp_l').value;
                const w = document.getElementById('inp_w').value;
                const q = document.getElementById('inp_q').value;
                desc = `${l}x${w} мм (${q} шт)`;
            }

            const record = {
                id: Date.now(),
                date: document.getElementById('date').value,
                worker: document.getElementById('worker').value.trim(),
                typeKey: type,
                typeName: config.label,
                desc: desc,
                qty: qty,
                unit: config.unit,
                rate: parseFloat(document.getElementById('rate').value),
                total: total
            };

            records.push(record);
            saveData();
            
            // Сброс формы (частичный)
            document.getElementById('worker').focus(); // фокус на имя для следующего
            // Очищаем инпуты объема, но оставляем дату и работника
            const inputs = document.querySelectorAll('#dynamicArea input');
            inputs.forEach(i => i.value = '');
            if(type === 'cut_mdf') document.getElementById('inp_q').value = 1;
            calcPreview();
            renderTable();
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
            updateWorkersList();
        }

        function updateWorkersList() {
            const workers = [...new Set(records.map(r => r.worker))];
            document.getElementById('workersList').innerHTML = workers.map(w => `<option value="${w}">`).join('');
        }

        // --- ТАБЛИЦА И ФИЛЬТРЫ ---

        function renderTable() {
            const fWorker = document.getElementById('filterWorker').value.toLowerCase();
            const fStart = document.getElementById('filterDateStart').value;
            const fEnd = document.getElementById('filterDateEnd').value;

            const filtered = records.filter(r => {
                const matchW = r.worker.toLowerCase().includes(fWorker);
                const matchD = (!fStart || r.date >= fStart) && (!fEnd || r.date <= fEnd);
                return matchW && matchD;
            }).sort((a,b) => b.id - a.id); // Новые сверху

            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            let sum = 0;
            
            filtered.forEach(r => {
                sum += r.total;
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>
                        <div style="font-weight:bold">${r.date.split('-').reverse().join('.')}</div>
                        <div style="color:#64748b">${r.worker}</div>
                    </td>
                    <td>
                        <div style="font-weight:bold; color:var(--primary)">${r.typeName}</div>
                        <div style="font-size:0.85rem">${r.desc || '-'}</div>
                    </td>
                    <td>
                        <div>${r.qty} <small>${r.unit}</small></div>
                        <div style="font-size:0.8rem; color:#64748b">по ${r.rate}₽</div>
                    </td>
                    <td class="money">${Math.round(r.total)} ₽</td>
                    <td><button class="btn btn-danger btn-sm" onclick="del(${r.id})">×</button></td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('totalSum').innerText = Math.round(sum) + ' ₽';
            document.getElementById('totalCount').innerText = filtered.length;
        }

        function del(id) {
            if(confirm('Удалить запись?')) {
                records = records.filter(r => r.id !== id);
                saveData();
                renderTable();
            }
        }

        // --- ЭКСПОРТ/ИМПОРТ ---
        
        function exportCSV() {
            let csv = '\uFEFFДата;Оператор;Тип работы;Описание;Объем;Ед.изм;Ставка;Сумма\n';
            records.forEach(r => {
                csv += `${r.date};${r.worker};${r.typeName};${r.desc};${r.qty};${r.unit};${r.rate};${r.total}\n`;
            });
            downloadFile(csv, 'report.csv', 'text/csv');
        }

        function exportJSON() {
            downloadFile(JSON.stringify(records, null, 2), 'backup.json', 'application/json');
        }

        function importJSON(input) {
            const file = input.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if(Array.isArray(data)) {
                        records = [...records, ...data];
                        // Убираем дубликаты по ID
                        records = records.filter((v,i,a)=>a.findIndex(t=>(t.id===v.id))===i);
                        saveData();
                        renderTable();
                        alert('Данные восстановлены!');
                    }
                } catch(err) { alert('Ошибка файла'); }
            };
            reader.readAsText(file);
        }

        function downloadFile(content, fileName, mimeType) {
            const a = document.createElement('a');
            const blob = new Blob([content], {type: mimeType});
            a.href = URL.createObjectURL(blob);
            a.download = fileName;
            a.click();
        }

        function clearData() {
            if(confirm('ТОЧНО УДАЛИТЬ ВСЁ?')) {
                records = [];
                saveData();
                renderTable();
            }
        }
    </script>
</body>
</html>
