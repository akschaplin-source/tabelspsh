<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>☕ Кофе Трекер</title>
    <meta name="theme-color" content="#667eea">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        html,body{height:100%;overflow:hidden}
        body{font-family:system-ui,-apple-system,sans-serif;background:#f5f5f5;padding:12px;overscroll-behavior:none}
        .container{max-width:600px;margin:0 auto;background:#fff;border-radius:12px;padding:14px;height:calc(100vh - 24px);overflow-y:auto}
        h1{color:#667eea;text-align:center;margin-bottom:12px;font-size:1.4em}
        .settings{display:flex;gap:6px;margin-bottom:12px;align-items:center;justify-content:center}
        .settings input{padding:6px;width:65px;border:1px solid #ddd;border-radius:4px;text-align:center}
        .settings button{padding:6px 10px;background:#667eea;color:#fff;border:none;border-radius:4px}
        .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
        .card{background:#f8f9fa;padding:12px;border-radius:8px}
        h2{color:#667eea;margin-bottom:8px;font-size:1em}
        .form-group{margin-bottom:8px}
        .form-group label{display:block;margin-bottom:2px;font-size:0.8em;color:#666}
        .form-group select,.form-group input{width:100%;padding:6px;border:1px solid #ddd;border-radius:4px;font-size:0.85em;background:#fff}
        .btn{width:100%;padding:8px;background:#667eea;color:#fff;border:none;border-radius:4px;font-weight:bold;font-size:0.9em}
        .tabs{display:flex;gap:4px;margin-bottom:8px}
        .tab{flex:1;padding:5px;background:#fff;border:1px solid #ddd;border-radius:4px;text-align:center;font-size:0.8em;cursor:pointer}
        .tab.active{background:#667eea;color:#fff;border-color:#667eea}
        .stat{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #eee;font-size:0.85em}
        .stat-value{font-weight:bold;color:#667eea}
        .progress{width:100%;height:10px;background:#e0e0e0;border-radius:5px;margin-top:8px;overflow:hidden}
        .progress-bar{height:100%;background:#667eea;width:0%;transition:width 0.3s}
        .filters{margin-bottom:8px}
        .filters select{width:100%;padding:5px;border:1px solid #ddd;border-radius:4px;font-size:0.85em}
        .history{max-height:40vh;overflow-y:auto}
        .item{background:#fff;padding:8px;border-radius:6px;margin-bottom:5px;display:flex;justify-content:space-between;align-items:center}
        .item-info{flex:1}
        .item-type{font-weight:bold;color:#667eea;font-size:0.85em}
        .item-details{font-size:0.75em;color:#666;margin-top:2px}
        .delete{background:#ff4757;color:#fff;border:none;padding:4px 8px;border-radius:4px;font-size:0.75em}
        .status{padding:6px;border-radius:4px;margin-bottom:8px;font-size:0.8em;text-align:center;display:none}
        .status.show{display:block}
        .status.ok{background:#d4edda;color:#155724}
        .status.warn{background:#fff3cd;color:#856404}
        .status.err{background:#f8d7da;color:#721c24}
        @media(max-width:768px){.grid{grid-template-columns:1fr}}
    </style>
</head>
<body>
    <div class="container">
        <h1>☕ Кофе Трекер</h1>
        
        <div class="status" id="status"></div>
        
        <div class="settings">
            <label>Норма мг:</label>
            <input type="number" id="limit" value="400">
            <button onclick="saveLimit()">✓</button>
        </div>

        <div class="grid">
            <div class="card">
                <h2>Добавить</h2>
                <div class="form-group">
                    <label>Напиток:</label>
                    <select id="type" onchange="toggleCustom()">
                        <option value="espresso">Эспрессо (63мг)</option>
                        <option value="americano">Американо (63мг)</option>
                        <option value="cappuccino">Капучино (63мг)</option>
                        <option value="latte">Латте (63мг)</option>
                        <option value="filter">Фильтр (95мг)</option>
                        <option value="instant">Растворимый (62мг)</option>
                        <option value="custom">Другое</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Кол-во:</label>
                    <input type="number" id="qty" value="1" min="1">
                </div>
                <div class="form-group" id="customGroup" style="display:none">
                    <label>Кофеин мг:</label>
                    <input type="number" id="customMg" min="0">
                </div>
                <button class="btn" onclick="addCoffee()">Добавить</button>
            </div>

            <div class="card">
                <h2>Статистика</h2>
                <div class="tabs">
                    <div class="tab active" onclick="setPeriod('day',this)">День</div>
                    <div class="tab" onclick="setPeriod('week',this)">Неделя</div>
                    <div class="tab" onclick="setPeriod('month',this)">Месяц</div>
                </div>
                <div class="stat"><span>Кофеин:</span><span class="stat-value" id="totalMg">0 мг</span></div>
                <div class="stat"><span>Чашек:</span><span class="stat-value" id="totalCups">0</span></div>
                <div class="stat"><span>Осталось:</span><span class="stat-value" id="remaining">400 мг</span></div>
                <div class="progress"><div class="progress-bar" id="bar"></div></div>
            </div>
        </div>

        <div class="card" style="margin-top:10px">
            <h2>История</h2>
            <div class="filters">
                <select id="filter" onchange="render()">
                    <option value="all">Все напитки</option>
                    <option value="espresso">Эспрессо</option>
                    <option value="americano">Американо</option>
                    <option value="cappuccino">Капучино</option>
                    <option value="latte">Латте</option>
                    <option value="filter">Фильтр</option>
                    <option value="instant">Растворимый</option>
                    <option value="custom">Другое</option>
                </select>
            </div>
            <div class="history" id="history"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@nicegoodthings/capacitor-pwa-fcm-bg@latest/dist/index.min.js" defer></script>
    <script>
        const MG={espresso:63,americano:63,cappuccino:63,latte:63,filter:95,instant:62};
        const NAMES={espresso:'Эспрессо',americano:'Американо',cappuccino:'Капучино',latte:'Латте',filter:'Фильтр',instant:'Растворимый',custom:'Другое'};
        
        let data=JSON.parse(localStorage.getItem('coffee')||'[]');
        let limit=parseInt(localStorage.getItem('limit'))||400;
        let period='day';
        let audioCtx=null;
        
        document.getElementById('limit').value=limit;
        
        // Инициализация при загрузке Capacitor
        document.addEventListener('DOMContentLoaded',()=>{
            if(window.Capacitor){
                initNative();
            }else{
                document.addEventListener('deviceready',initNative);
            }
        });
        
        async function initNative(){
            try{
                // Локальные уведомления
                const {LocalNotifications}=await import('@capacitor/local-notifications');
                await LocalNotifications.requestPermissions();
                
                // Push уведомления (если настроен Firebase)
                const {PushNotifications}=await import('@capacitor/push-notifications');
                await PushNotifications.requestPermissions();
                await PushNotifications.register();
                
                PushNotifications.addListener('pushNotificationReceived',notification=>{
                    showStatus(notification.title+' '+notification.body,'warn');
                });
            }catch(e){
                console.log('Native init:',e);
            }
            
            update();
        }
        
        function playSound(){
            try{
                if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
                const osc=audioCtx.createOscillator();
                const gain=audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.frequency.value=800;
                gain.gain.setValueAtTime(0.3,audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.3);
                osc.start();
                osc.stop(audioCtx.currentTime+0.3);
            }catch(e){}
        }
        
        function showStatus(msg,type){
            const el=document.getElementById('status');
            el.textContent=msg;
            el.className='status show '+type;
            setTimeout(()=>el.classList.remove('show'),3000);
        }
        
        async function sendLocalNotification(title,body){
            try{
                const {LocalNotifications}=await import('@capacitor/local-notifications');
                await LocalNotifications.schedule({
                    notifications:[{
                        title,body,
                        id:Date.now(),
                        schedule:{at:new Date(Date.now()+1000)},
                        sound:'default',
                        smallIcon:'ic_stat_icon_config_sample',
                        actionTypeId:'INFO'
                    }]
                });
            }catch(e){
                if('Notification'in window&&Notification.permission==='granted'){
                    new Notification(title,{body});
                }
            }
        }
        
        function saveLimit(){
            limit=parseInt(document.getElementById('limit').value)||400;
            localStorage.setItem('limit',limit);
            showStatus('Норма сохранена: '+limit+' мг','ok');
            update();
        }
        
        function toggleCustom(){
            document.getElementById('customGroup').style.display=
                document.getElementById('type').value==='custom'?'block':'none';
        }
        
        function addCoffee(){
            const type=document.getElementById('type').value;
            const qty=parseInt(document.getElementById('qty').value)||1;
            const mg=type==='custom'?(parseInt(document.getElementById('customMg').value)||0)*qty:MG[type]*qty;
            
            data.push({id:Date.now(),type,qty,mg,date:new Date().toISOString()});
            localStorage.setItem('coffee',JSON.stringify(data));
            
            document.getElementById('qty').value=1;
            document.getElementById('customMg').value='';
            
            playSound();
            update();
            checkNotify();
            showStatus('Добавлено: '+mg+' мг кофеина','ok');
        }
        
        function setPeriod(p,el){
            period=p;
            document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
            el.classList.add('active');
            update();
        }
        
        function filterData(){
            const now=Date.now();
            const day=86400000;
            const cutoff=period==='day'?now-day:period==='week'?now-7*day:now-30*day;
            return data.filter(d=>new Date(d.date).getTime()>=cutoff);
        }
        
        function update(){
            const filtered=filterData();
            const totalMg=filtered.reduce((s,d)=>s+d.mg,0);
            const totalCups=filtered.reduce((s,d)=>s+d.qty,0);
            const remaining=limit-totalMg;
            
            document.getElementById('totalMg').textContent=totalMg+' мг';
            document.getElementById('totalCups').textContent=totalCups;
            document.getElementById('remaining').textContent=remaining+' мг';
            
            const pct=Math.min((totalMg/limit)*100,100);
            const bar=document.getElementById('bar');
            bar.style.width=pct+'%';
            bar.style.background=pct>100?'#ff4757':'#667eea';
            
            render();
        }
        
        function render(){
            const filter=document.getElementById('filter').value;
            const filtered=filter!=='all'?data.filter(d=>d.type===filter):data;
            const html=filtered.slice(-20).reverse().map(d=>`
                <div class="item">
                    <div class="item-info">
                        <div class="item-type">${NAMES[d.type]}</div>
                        <div class="item-details">${d.qty} чаш • ${d.mg} мг • ${new Date(d.date).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</div>
                    </div>
                    <button class="delete" onclick="del(${d.id})">✕</button>
                </div>
            `).join('');
            document.getElementById('history').innerHTML=html||'<p style="text-align:center;color:#999;font-size:0.85em">Нет записей</p>';
        }
        
        function del(id){
            data=data.filter(d=>d.id!==id);
            localStorage.setItem('coffee',JSON.stringify(data));
            update();
        }
        
        function checkNotify(){
            const today=data.filter(d=>new Date(d.date).toDateString()===new Date().toDateString());
            const total=today.reduce((s,d)=>s+d.mg,0);
            
            if(total>limit){
                sendLocalNotification('⚠️ Превышение нормы!',`Выпито ${total} мг. Норма: ${limit} мг`);
            }else if(total<limit*0.3&&new Date().getHours()>18){
                sendLocalNotification('☕ Мало кофеина',`Сегодня только ${total} мг`);
            }
        }
        
        update();
    </script>
</body>
</html>
