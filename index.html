<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Учет работ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#1a1a2e;color:#fff;min-height:100vh;padding-bottom:80px}
.header{background:linear-gradient(135deg,#fc0,#ff6b00);padding:20px;text-align:center;border-radius:0 0 20px 20px}
.header h1{color:#000;margin-bottom:5px}
.container{padding:15px;max-width:500px;margin:0 auto}
.panel{display:none}
.panel.active{display:block}
.card{background:#2a2a4a;border-radius:15px;padding:20px;margin-bottom:15px}
.card h2{margin-bottom:15px;font-size:18px}
input{width:100%;padding:15px;border:2px solid #444;border-radius:10px;background:#1a1a2e;color:#fff;font-size:18px;text-align:center;text-transform:uppercase;margin-bottom:15px}
input:focus{outline:none;border-color:#fc0}
.btn{width:100%;padding:15px;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;margin-bottom:10px}
.btn-primary{background:linear-gradient(135deg,#fc0,#ff6b00);color:#000}
.btn-secondary{background:#444;color:#fff}
.btn-danger{background:#f44336;color:#fff}
.btn-success{background:#4caf50;color:#fff}
.result{background:#1b5e20;border:1px solid #4caf50;border-radius:10px;padding:15px;margin:15px 0;display:none}
.result.show{display:block}
.error{background:#b71c1c;border:1px solid #f44336;border-radius:10px;padding:15px;margin:15px 0;display:none}
.error.show{display:block}
.total{background:linear-gradient(135deg,#fc0,#ff6b00);color:#000;padding:20px;border-radius:15px;text-align:right;margin-bottom:15px}
.total h3{font-size:32px}
.history-item{background:#2a2a4a;border-radius:10px;padding:15px;margin-bottom:10px}
.history-code{color:#fc0;font-family:monospace;font-weight:bold;margin-bottom:5px}
.history-info{font-size:14px;color:#aaa;margin:5px 0}
.history-price{color:#4caf50;font-weight:bold;font-size:18px;text-align:right}
.nav{position:fixed;bottom:0;left:0;right:0;background:#2a2a4a;display:flex;justify-content:space-around;padding:10px;border-top:1px solid #444}
.nav button{background:none;border:none;color:#aaa;font-size:12px;cursor:pointer;padding:5px 15px}
.nav button.active{color:#fc0}
.nav button div{font-size:24px;margin-bottom:2px}
label{display:block;margin-bottom:5px;color:#aaa;font-size:14px}
select,textarea{width:100%;padding:10px;border:2px solid #444;border-radius:8px;background:#1a1a2e;color:#fff;margin-bottom:10px}
.row{display:flex;gap:10px}
.row > div{flex:1}
</style>
</head>
<body>

<div class="header">
    <h1> Учет работ</h1>
    <div>Ввод • Расчет • История</div>
</div>

<div class="container">

<!-- ВВОД -->
<div id="input" class="panel active">
    <div class="card">
        <h2>📱 Ввод кода</h2>
        <input type="text" id="code" placeholder="ВВЕДИТЕ КОД" autocomplete="off">
        <button class="btn btn-primary" onclick="addWork()">✅ Добавить</button>
        
        <div id="result" class="result">
            <div><b>Тип:</b> <span id="r-type"></span></div>
            <div><b>Параметры:</b> <span id="r-params"></span></div>
            <div><b>Размеры:</b> <span id="r-sizes"></span></div>
            <div><b>Количество:</b> <span id="r-amount"></span></div>
            <div style="font-size:24px;margin-top:10px;text-align:center"><b>💰 <span id="r-pay"></span> ₽</b></div>
        </div>
        
        <div id="error" class="error"></div>
    </div>
    
    <div class="card">
        <h2>📖 Примеры кодов:</h2>
        <div style="font-family:monospace;background:#1a1a2e;padding:10px;border-radius:8px;margin:10px 0">
            <div>ВП162100 800-ВБ-154.002</div>
            <div style="color:#aaa;font-size:12px;margin-top:5px">
                ВП = тип<br>
                16 = толщина<br>
                2100 800 = длина и ширина<br>
                ВБ-154.002 = номер
            </div>
        </div>
    </div>
</div>

<!-- ИСТОРИЯ -->
<div id="history" class="panel">
    <div class="total">
        <div style="font-size:14px">Всего заработано:</div>
        <h3><span id="total-sum">0</span> ₽</h3>
    </div>
    <div id="history-list"></div>
    <button class="btn btn-danger" onclick="clearHistory()">🗑️ Очистить всё</button>
</div>

<!-- ТИПЫ -->
<div id="types" class="panel">
    <div class="card">
        <h2>🔧 Типы работ</h2>
        <button class="btn btn-success" onclick="showTypeForm()">➕ Добавить тип</button>
    </div>
    <div id="types-list"></div>
    
    <div id="type-form" class="card" style="display:none">
        <h2 id="form-title">Новый тип</h2>
        <label>Префикс (первые буквы)</label>
        <input type="text" id="t-prefix" placeholder="ВП" style="text-align:left">
        
        <label>Название</label>
        <input type="text" id="t-name" placeholder="Внутренняя панель" style="text-align:left">
        
        <label>Тип расчета</label>
        <select id="t-mode" onchange="updateFormula()">
            <option value="area">Площадь (м²) - длина × ширина</option>
            <option value="linear">Погонные метры - только длина</option>
        </select>
        
        <label>Формула</label>
        <textarea id="t-formula" rows="2" placeholder="(Длина * Ширина / 1000000)"></textarea>
        
        <label>Тариф (₽ за единицу)</label>
        <input type="number" id="t-rate" value="500" style="text-align:left">
        
        <label>Единица</label>
        <input type="text" id="t-unit" value="₽/м²" style="text-align:left">
        
        <div class="row">
            <button class="btn btn-success" onclick="saveType()">💾 Сохранить</button>
            <button class="btn btn-secondary" onclick="hideTypeForm()">Отмена</button>
        </div>
    </div>
</div>

<!-- НАСТРОЙКИ -->
<div id="settings" class="panel">
    <div class="card">
        <h2>⚙️ Настройки</h2>
        <button class="btn btn-primary" onclick="exportData()">📤 Экспорт</button>
        <button class="btn btn-secondary" onclick="document.getElementById('import').click()">📥 Импорт</button>
        <input type="file" id="import" style="display:none" accept=".json" onchange="importData(event)">
        <button class="btn btn-danger" onclick="resetAll()">️ Сбросить всё</button>
    </div>
</div>

</div>

<div class="nav">
    <button class="active" onclick="showPanel('input')"><div>📱</div>Ввод</button>
    <button onclick="showPanel('history')"><div>📋</div>История</button>
    <button onclick="showPanel('types')"><div>🔧</div>Типы</button>
    <button onclick="showPanel('settings')"><div>⚙️</div>Ещё</button>
</div>

<script>
// ДАННЫЕ
let history = JSON.parse(localStorage.getItem('workHistory') || '[]');
let types = JSON.parse(localStorage.getItem('workTypes') || '[]');

// Типы по умолчанию
if(types.length === 0){
    types = [
        {prefix:'ВП', name:'Внутренняя панель', mode:'area', formula:'(Длина * Ширина / 1000000)', rate:500, unit:'₽/м²', dims:['Длина','Ширина']},
        {prefix:'НП', name:'Наружная панель', mode:'area', formula:'(Длина * Ширина / 1000000)', rate:500, unit:'₽/м²', dims:['Длина','Ширина']},
        {prefix:'Н', name:'Наличник', mode:'linear', formula:'(Длина / 1000)', rate:300, unit:'₽/м.п.', dims:['Длина']}
    ];
    saveTypes();
}

function saveTypes(){localStorage.setItem('workTypes', JSON.stringify(types))}
function saveHistory(){localStorage.setItem('workHistory', JSON.stringify(history))}

// НАВИГАЦИЯ
function showPanel(id){
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    event.target.closest('button').classList.add('active');
    if(id === 'history') renderHistory();
    if(id === 'types') renderTypes();
}

// ПАРСИНГ КОДА
function parseCode(code){
    code = code.toUpperCase().trim();
    if(!code) return null;
    
    // Ищем подходящий тип по префиксу
    for(let t of types){
        if(code.startsWith(t.prefix)){
            try{
                return extractData(code, t);
            }catch(e){
                console.log('Ошибка типа '+t.prefix+':', e);
            }
        }
    }
    return null;
}

function extractData(code, type){
    let pos = type.prefix.length;
    let params = {};
    let display = [];
    
    // Здесь можно добавить извлечение параметров (толщина и т.д.)
    // Для простоты пропускаем
    
    // Извлекаем размеры
    let sizesBlock = '';
    let partNumber = '';
    
    // Ищем разделитель номера детали (-)
    let dashIndex = code.indexOf('-', pos);
    if(dashIndex > 0){
        sizesBlock = code.substring(pos, dashIndex);
        partNumber = code.substring(dashIndex);
    } else {
        sizesBlock = code.substring(pos);
    }
    
    // Разбираем размеры (разделены пробелом и /)
    let pairs = sizesBlock.split('/');
    let sizes = [];
    let totalAmount = 0;
    
    for(let pair of pairs){
        let dims = pair.trim().split(/\s+/);
        if(dims.length >= type.dims.length){
            let pairData = {};
            let pairText = [];
            
            for(let i = 0; i < type.dims.length; i++){
                let val = parseFloat(dims[i]);
                if(!isNaN(val)){
                    pairData[type.dims[i]] = val;
                    pairText.push(type.dims[i] + ': ' + val);
                }
            }
            
            if(Object.keys(pairData).length > 0){
                sizes.push(pairText.join(', '));
                
                // Считаем по формуле
                let formula = type.formula;
                for(let key in pairData){
                    formula = formula.replace(new RegExp(key, 'g'), '(' + pairData[key] + ')');
                }
                try{
                    let result = eval(formula);
                    totalAmount += result;
                }catch(e){
                    throw new Error('Ошибка формулы: ' + e.message);
                }
            }
        }
    }
    
    if(sizes.length === 0){
        throw new Error('Не найдены размеры в коде');
    }
    
    let payment = Math.round(totalAmount * type.rate);
    
    return {
        type: type.name,
        params: display.join(', '),
        sizes: sizes,
        partNumber: partNumber || '—',
        amount: totalAmount,
        unit: type.unit.replace('₽/', ''),
        payment: payment,
        code: code
    };
}

// ДОБАВЛЕНИЕ РАБОТЫ
function addWork(){
    let code = document.getElementById('code').value;
    let resultDiv = document.getElementById('result');
    let errorDiv = document.getElementById('error');
    
    resultDiv.classList.remove('show');
    errorDiv.classList.remove('show');
    
    if(!code){
        showError('Введите код');
        return;
    }
    
    let data = parseCode(code);
    if(!data){
        showError('Код не распознан. Проверьте префикс и формат.');
        return;
    }
    
    // Показываем результат
    document.getElementById('r-type').textContent = data.type;
    document.getElementById('r-params').textContent = data.params || '—';
    document.getElementById('r-sizes').textContent = data.sizes.join(' / ');
    document.getElementById('r-amount').textContent = data.amount.toFixed(4) + ' ' + data.unit;
    document.getElementById('r-pay').textContent = data.payment.toLocaleString();
    resultDiv.classList.add('show');
    
    // Добавляем в историю
    history.push({
        date: new Date().toLocaleString('ru-RU'),
        code: data.code,
        type: data.type,
        sizes: data.sizes,
        amount: data.amount,
        unit: data.unit,
        payment: data.payment
    });
    saveHistory();
    
    // Очищаем поле
    document.getElementById('code').value = '';
    setTimeout(() => document.getElementById('code').focus(), 100);
}

function showError(msg){
    let errorDiv = document.getElementById('error');
    errorDiv.textContent = '❌ ' + msg;
    errorDiv.classList.add('show');
}

// ИСТОРИЯ
function renderHistory(){
    let list = document.getElementById('history-list');
    let total = 0;
    
    if(history.length === 0){
        list.innerHTML = '<div style="text-align:center;color:#666;padding:40px">Нет записей</div>';
        document.getElementById('total-sum').textContent = '0';
        return;
    }
    
    list.innerHTML = '';
    let reversed = [...history].reverse();
    
    reversed.forEach((item, idx) => {
        total += item.payment;
        let realIdx = history.length - 1 - idx;
        
        let div = document.createElement('div');
        div.className = 'history-item';
        div.innerHTML = `
            <div class="history-code">${item.code}</div>
            <div class="history-info">${item.type}</div>
            <div class="history-info">${item.sizes.join(' / ')}</div>
            <div class="history-info">${item.amount.toFixed(4)} ${item.unit}</div>
            <div class="history-info" style="font-size:11px;color:#666">${item.date}</div>
            <div class="history-price">${item.payment.toLocaleString()} ₽</div>
            <button class="btn btn-danger" style="margin-top:10px;padding:8px" onclick="deleteItem(${realIdx})">Удалить</button>
        `;
        list.appendChild(div);
    });
    
    document.getElementById('total-sum').textContent = total.toLocaleString();
}

function deleteItem(idx){
    if(confirm('Удалить эту запись?')){
        history.splice(idx, 1);
        saveHistory();
        renderHistory();
    }
}

function clearHistory(){
    if(confirm('Очистить всю историю?')){
        history = [];
        saveHistory();
        renderHistory();
    }
}

// ТИПЫ РАБОТ
function renderTypes(){
    let list = document.getElementById('types-list');
    
    if(types.length === 0){
        list.innerHTML = '<div style="text-align:center;color:#666;padding:20px">Нет типов</div>';
        return;
    }
    
    list.innerHTML = '';
    types.forEach((t, idx) => {
        let div = document.createElement('div');
        div.className = 'card';
        div.innerHTML = `
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
                <b>${t.name}</b>
                <span style="background:#fc0;color:#000;padding:3px 8px;border-radius:5px;font-family:monospace">${t.prefix}</span>
            </div>
            <div style="font-size:13px;color:#aaa;margin:5px 0">
                ${t.mode === 'area' ? '📐 м²' : '📏 пог.м'} • ${t.rate} ${t.unit}
            </div>
            <div style="font-family:monospace;background:#1a1a2e;padding:8px;border-radius:5px;font-size:12px;margin:10px 0">
                ${t.formula}
            </div>
            <div style="display:flex;gap:10px">
                <button class="btn btn-secondary" onclick="editType(${idx})" style="flex:1">✏️</button>
                <button class="btn btn-danger" onclick="deleteType(${idx})" style="flex:1">🗑️</button>
            </div>
        `;
        list.appendChild(div);
    });
}

function showTypeForm(){
    document.getElementById('type-form').style.display = 'block';
    document.getElementById('form-title').textContent = 'Новый тип';
    document.getElementById('t-prefix').value = '';
    document.getElementById('t-name').value = '';
    document.getElementById('t-mode').value = 'area';
    document.getElementById('t-formula').value = '(Длина * Ширина / 1000000)';
    document.getElementById('t-rate').value = '500';
    document.getElementById('t-unit').value = '₽/м²';
}

function hideTypeForm(){
    document.getElementById('type-form').style.display = 'none';
}

function updateFormula(){
    let mode = document.getElementById('t-mode').value;
    let formula = document.getElementById('t-formula');
    let unit = document.getElementById('t-unit');
    
    if(mode === 'area'){
        formula.value = '(Длина * Ширина / 1000000)';
        unit.value = '₽/м²';
    } else {
        formula.value = '(Длина / 1000)';
        unit.value = '₽/м.п.';
    }
}

function saveType(){
    let prefix = document.getElementById('t-prefix').value.toUpperCase().trim();
    let name = document.getElementById('t-name').value.trim();
    let mode = document.getElementById('t-mode').value;
    let formula = document.getElementById('t-formula').value.trim();
    let rate = parseFloat(document.getElementById('t-rate').value);
    let unit = document.getElementById('t-unit').value.trim();
    
    if(!prefix || !name || !formula){
        alert('Заполните все поля');
        return;
    }
    
    let dims = mode === 'area' ? ['Длина','Ширина'] : ['Длина'];
    
    types.push({prefix, name, mode, formula, rate, unit, dims});
    saveTypes();
    hideTypeForm();
    renderTypes();
    alert('✅ Сохранено!');
}

function editType(idx){
    let t = types[idx];
    document.getElementById('type-form').style.display = 'block';
    document.getElementById('form-title').textContent = 'Редактировать';
    document.getElementById('t-prefix').value = t.prefix;
    document.getElementById('t-name').value = t.name;
    document.getElementById('t-mode').value = t.mode;
    document.getElementById('t-formula').value = t.formula;
    document.getElementById('t-rate').value = t.rate;
    document.getElementById('t-unit').value = t.unit;
    
    // Удаляем старый при сохранении
    window.editingType = idx;
}

function deleteType(idx){
    if(confirm('Удалить тип?')){
        types.splice(idx, 1);
        saveTypes();
        renderTypes();
    }
}

// НАСТРОЙКИ
function exportData(){
    let data = {types, history, date: new Date().toISOString()};
    let blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
    let url = URL.createObjectURL(blob);
    let a = document.createElement('a');
    a.href = url;
    a.download = 'backup_' + new Date().toISOString().split('T')[0] + '.json';
    a.click();
}

function importData(event){
    let file = event.target.files[0];
    if(!file) return;
    
    let reader = new FileReader();
    reader.onload = function(e){
        try{
            let data = JSON.parse(e.target.result);
            if(data.types) types = data.types;
            if(data.history) history = data.history;
            saveTypes();
            saveHistory();
            alert('✅ Импорт выполнен!');
        }catch(err){
            alert('Ошибка: ' + err.message);
        }
    };
    reader.readAsText(file);
    event.target.value = '';
}

function resetAll(){
    if(confirm('️ Удалить ВСЕ данные?')){
        if(confirm('Точно?')){
            localStorage.removeItem('workTypes');
            localStorage.removeItem('workHistory');
            location.reload();
        }
    }
}

// Старт
document.getElementById('code').addEventListener('keypress', function(e){
    if(e.key === 'Enter') addWork();
});
</script>

</body>
</html>
